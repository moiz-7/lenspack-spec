name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.3.3 jsonschema==4.23.0 cryptography==43.0.3
      - name: No private key material anywhere in the tree
        run: python tools/scan_secrets.py
      - name: Conformance cases, goldens, signing, namespaces and zip rules
        run: python -m pytest -q tests
      - name: Every gallery pack and example validates
        run: |
          for p in examples/*.cube examples/*.lenspack packs/*.lenspack dist/*.lenspack; do
            [ -e "$p" ] || continue
            python validator/validate_lenspack.py "$p"
          done
      - name: index.json and dist/ are rebuilt from packs/
        run: python tools/build_index.py --check
      - name: The pip package installs and its CLI runs
        run: |
          pip install .
          lenspack validate examples/party-crown.lenspack
          lenspack verify-index index.json --keys index-keys.json
      - name: Pack authors own their namespaces
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/check_namespaces.py --author "$PR_AUTHOR" --base "$BASE_SHA"
