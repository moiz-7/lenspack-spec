name: publish-pypi

# PyPI trusted publishing: GitHub's OIDC token, no API token stored anywhere. The owner registers
# this workflow as a trusted publisher for the `lenspack` project on PyPI (PUBLISHING.md).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }
      - run: pip install build==1.2.2 pytest==8.3.3 jsonschema==4.23.0 && python -m pytest -q tests
      - run: python -m build --outdir dist-py
      - uses: actions/upload-artifact@v4
        with:
          name: dist-py
          path: dist-py/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-py
          path: dist-py/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-py/
